plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
    // 2.4.0 = first line whose stdlib metadata matches, and 2.3.0+ is required
    // because Kotlin only gained JVM target 25 support in 2.3.0 (Kotlin 2.2.x
    // silently falls back to JVM_24, which Gradle 9's KGP then rejects as an
    // inconsistent JVM-target pair against compileJava(25)).
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// DXRMC 自检开关：用 providers API 读取（可被配置缓存追踪），`-P` 与 `-D` 两种写法都接受。
// Loom 的 run config 不会自动继承 Gradle 进程的系统属性，必须显式转发到游戏 JVM。
def dxrmcSelfTestMesh = providers.gradleProperty('dxrmc.selfTestMesh')
        .orElse(providers.systemProperty('dxrmc.selfTestMesh')).getOrElse('false')
def dxrmcSelfTestSurface = providers.gradleProperty('dxrmc.selfTestSurface')
        .orElse(providers.systemProperty('dxrmc.selfTestSurface')).getOrElse('false')
def dxrmcFailDevice = providers.gradleProperty('dxrmc.failDevice')
        .orElse(providers.systemProperty('dxrmc.failDevice')).getOrElse('false')
// P74：致命错误弹窗抑制开关（自动化运行用；正常游玩不要设置，保持可见弹窗）。
def dxrmcNoPopup = providers.gradleProperty('dxrmc.noPopup')
        .orElse(providers.systemProperty('dxrmc.noPopup')).getOrElse('false')
// P75：时间性渲染（TAAU 基础）开关：`gradlew runClient -Pdxrmc.temporal=true` 打开亚像素 jitter。
// 默认 false —— 速度附件尚未接线，抖动了也没有 resolve 可消除它，只会让画面轻微发糊。
def dxrmcTemporal = providers.gradleProperty('dxrmc.temporal')
        .orElse(providers.systemProperty('dxrmc.temporal')).getOrElse('false')
// P75 诊断开关：`-Pdxrmc.temporal.jitter=false` 只关掉**投影 jitter**、保留逐物体/相机捕获，
// 用来把"画面异常"在 jitter 与捕获两条路径之间二分定位。默认 true（正常行为）。
def dxrmcTemporalJitter = providers.gradleProperty('dxrmc.temporal.jitter')
        .orElse(providers.systemProperty('dxrmc.temporal.jitter')).getOrElse('true')
// P76a：速度（运动矢量）附件开关：`-Pdxrmc.temporal.velocity=true`。默认 false ——
// 增量 1 只接通 MRT 基础设施（速度纹理 + 变体管线 + 地形 pass 多挂一路 RTV），
// 还没有着色器写 SV_Target1，所以打开它只会多花两张 R16G16_FLOAT 纹理与每条地形管线一份 PSO。
def dxrmcTemporalVelocity = providers.gradleProperty('dxrmc.temporal.velocity')
        .orElse(providers.systemProperty('dxrmc.temporal.velocity')).getOrElse('false')
// 自动化取证：`-Pdxrmc.quickPlayWorld=<存档名>` 让客户端启动后直接进单人世界（无人值守截图/复现用）。
// 空字符串 = 不传（普通游玩保持手动进世界）。
def dxrmcQuickPlayWorld = providers.gradleProperty('dxrmc.quickPlayWorld').getOrElse('')

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // P72 mesh shader 自检开关：`gradlew runClient -Ddxrmc.selfTestMesh=true`（或 -P 形式）。
            // Loom 的 run config 不会自动继承 Gradle 进程的系统属性，必须显式转发。
            systemProperty 'dxrmc.selfTestMesh', dxrmcSelfTestMesh
            // 同理转发 surface 自检开关（真实窗口交换链自检，默认关闭）。
            systemProperty 'dxrmc.selfTestSurface', dxrmcSelfTestSurface
            // P73 失败策略的测试钩子：`gradlew runClient -Ddxrmc.failDevice=true` 让 D3D12 后端
            // 在第一步失败，验证"不再回退 + 还原 preferredGraphicsBackend + 崩溃报告带说明"。
            systemProperty 'dxrmc.failDevice', dxrmcFailDevice
            // P74 致命错误弹窗：默认可见（用户要求，m02777）；自动化运行用 `-Pdxrmc.noPopup=true` 关掉，
            // 否则 MessageBox 会一直阻塞等待点击。
            systemProperty 'dxrmc.noPopup', dxrmcNoPopup
            // P75 时间性渲染开关（亚像素 jitter 注入关卡投影矩阵）。
            systemProperty 'dxrmc.temporal', dxrmcTemporal
            // P75 诊断：只关 jitter、保留捕获（默认 true）。
            systemProperty 'dxrmc.temporal.jitter', dxrmcTemporalJitter
            // P76a：速度附件（默认 false，见上面的说明）。
            systemProperty 'dxrmc.temporal.velocity', dxrmcTemporalVelocity
            // 自动化取证：直接进指定存档（P75/P76 画面比对用；普通游玩不设置）。
            // 注意 Loom 的 runClient **不支持** `--args=`，参数只能在这里追加。
            if (!dxrmcQuickPlayWorld.isEmpty()) {
                programArgument '--quickPlaySingleplayer'
                programArgument dxrmcQuickPlayWorld
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG

            // The DirectX 12 backend talks to native code through the Java FFM API
            // (java.lang.foreign.Linker), which JEP 472 classifies as a RESTRICTED method.
            // The JVM denies restricted calls made from unnamed-module (class path) code
            // unless native access is explicitly enabled: JDK 25 still only warns, but the
            // warning is scheduled to become a hard error. A mod cannot grant itself native
            // access at runtime, and NeoForge/FML does not set this flag anywhere, so it has
            // to come from the command line -- here for dev runs.
            // End users must add the very same options to their launcher's JVM arguments:
            //     --enable-native-access=ALL-UNNAMED
            jvmArgument '--enable-native-access=ALL-UNNAMED'
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    implementation 'thedarkcolour:kotlinforforge-neoforge:6.4.0'
}

// Expands the declared replace properties in the resource targets below; a missing property
// fails the build. Placeholders use Groovy's SimpleTemplateEngine (${}) notation.
// META-INF/neoforge.mods.toml is the only resource in this project that carries placeholders,
// and it lives in src/main/resources like every other resource: expanding it in place with
// filesMatching keeps a single copy of that path in the resource set, whereas a separate
// ProcessResources task feeding an extra resource srcDir fails with
// "Entry META-INF/neoforge.mods.toml is a duplicate" as soon as both directories carry it.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            kff_version_range      : kff_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// ---------------------------------------------------------------------------
// copyNative — stage the MCDR native DLL into the mod resources
// ---------------------------------------------------------------------------
// `MCDR\` (the native library) and `Illusion\` (this mod) are INDEPENDENTLY
// managed repositories, so a build of this project may legitimately run with no
// native output present at all: a fresh clone, CI that only builds the JVM half,
// or a developer who has not run MSBuild yet. This task therefore NEVER fails
// the build — it stages MCDR.dll when it can find one, and logs a warning and
// skips when it cannot.
//
// The DLL is staged at the RESOURCE ROOT because MCDR_ABI.extractLibrary() looks
// it up as `/MCDR.dll` on the classpath — which resolves both from the packaged
// mod JAR and from build/resources/main during `runClient`.
//
// Build the native half first (Visual Studio 2026 / MSVC v145, C++23):
//   msbuild MCDR\MCDR.vcxproj /p:Configuration=Release /p:Platform=x64
def MCDRNativeDir = file('../MCDR')
def MCDRNativeConfigs = ['x64_Release', 'x64_Debug']

var copyNative = tasks.register('copyNative') {
    group = 'build'
    description = 'Stages MCDR.dll into the mod resources; skips (never fails) when the native build output is absent.'
    var outDir = layout.buildDirectory.dir('generated/native')
    outputs.dir(outDir)
    // Always re-run: the copy is trivial, and a stale staged DLL is far more
    // expensive to diagnose than the copy is to repeat.
    outputs.upToDateWhen { false }
    doLast {
        try {
            var dir = outDir.get().asFile
            dir.mkdirs()
            var candidates = MCDRNativeConfigs.collect { new File(MCDRNativeDir, "target/${it}/MCDR.dll") }
            var src = candidates.find { it.isFile() }
            if (src == null) {
                logger.warn("[copyNative] MCDR.dll not found; looked in: ${candidates.join(', ')}. " +
                        "Skipping native staging — build MCDR with MSBuild if the D3D12 backend is needed.")
                return
            }
            var dst = new File(dir, 'MCDR.dll')
            dst.bytes = src.bytes
            logger.lifecycle("[copyNative] staged ${src} -> ${dst} (${dst.length()} bytes)")
        } catch (Throwable t) {
            // Independently managed repos: a missing, locked or half-written native
            // output must never break the JVM build.
            logger.warn("[copyNative] skipped: ${t}")
        }
    }
}

// Feed the staged directory into the main resource set so the DLL ends up in
// build/resources/main and inside the mod JAR.
sourceSets.main.resources.srcDir copyNative

// ---------------------------------------------------------------------------
// Third-party SDK runtimes: what ships inside the JAR, and what does not
// ---------------------------------------------------------------------------
// MCDR_ABI.extractLibrary() writes MCDR.dll into `<user.dir>/dxrmc/`, and the
// Windows loader resolves a native library's LoadLibrary calls from the
// *application* directory first -- so anything MCDR.dll loads at run time has to
// sit in that same `dxrmc/` folder. PATH is not enough: the application directory
// and the system directory both precede it in the search order, which is why a
// PATH-only experiment reports "not found" even with the files present on disk
// (known_bugs.md B14).
//
// TWO LISTS, and the split is a licensing decision, not a size one:
//
//   vendorJarLibs  -- REDISTRIBUTABLE under this project's LGPL-2.1.
//                     Staged as JAR resources and extracted to `dxrmc/` at
//                     startup by MCDR_ABI.extractVendorResources(). Both licences
//                     permit binary redistribution provided the copyright notice
//                     and terms travel with the distribution, so each SDK's
//                     licence text is packed alongside its binaries.
//
//   vendorDllSources -- NOT redistributable through this project.
//                     NVIDIA's RTX SDKs licence (NRD and DLSS share it) clause
//                     4(e) forbids using the SDK "in any manner that would cause
//                     it to become subject to an open source software license",
//                     listing as examples: disclosure in source form, licensing
//                     for derivative works, and redistribution at no charge --
//                     which is what LGPL-2.1 requires. So the NVIDIA runtime DLLs
//                     are never packed; they are copied into `run/dxrmc/` only to
//                     make the local dev environment match what the probe looks
//                     for. End users obtain them from NVIDIA if they want them.
//
// License compatibility for the packaged two, verified against the shipped text:
//   Intel XeSS      -- Intel Simplified Software License (October 2022), binary
//                      redistribution permitted; requires the notice be reproduced.
//   AMD FidelityFX  -- AMD binary-only redistribution grant in docs/license.md;
//                      requires the copyright and permission notice be reproduced.
def vendorJarLibs = [
        [dir: file('../MCDR/external/xess/bin'), files: ['libxess.dll', 'libxess_fg.dll', 'libxell.dll'],
         license: file('../MCDR/external/xess/LICENSE.txt')],
        [dir: file('../MCDR/external/fidelityfx/bin'),
         files: ['amd_fidelityfx_loader_dx12.dll', 'amd_fidelityfx_upscaler_dx12.dll',
                 'amd_fidelityfx_denoiser_dx12.dll', 'amd_fidelityfx_radiancecache_dx12.dll',
                 'amd_fidelityfx_framegeneration_dx12.dll'],
         license: file('../MCDR/external/fidelityfx/LICENSE.md')],
]

// Dev-only. `nvngx_dlssd.dll` is Ray Reconstruction, `nvngx_dlssg.dll` is Frame
// Generation. libxess_dx11.dll is deliberately absent: D3D11 flavour, and MCDR
// is D3D12-only.
def vendorDevLibs = [
        [dir: file('../MCDR/external/dlss/bin/x64'), pattern: 'nvngx_*.dll'],
]

// Minimal glob -> regex, so `nvngx_*.dll` matches without pulling in a full
// Ant-style matcher for a single fixed pattern.
def vendorGlobToRegex = { String glob ->
    '^' + glob.replace('.', '\\.').replace('*', '.*') + '$'
}

// ---------------------------------------------------------------------------
// stageVendorLibs -- put the redistributable SDK runtimes INTO the mod JAR
// ---------------------------------------------------------------------------
// The mod JAR cannot reference these by path: a released mod is one file, and
// `gradlew build` runs long before anything is unzipped. So the DLLs ride inside
// the JAR as ordinary resources and MCDR_ABI pulls them out at startup.
//
// `vendor/manifest.txt` exists because a JAR directory cannot be enumerated
// without knowing every name in advance, and hard-coding nine file names in two
// places is how the two lists drift apart. The manifest is written here, at the
// moment the files are staged, so it cannot disagree with what was packaged.
//
// The staging root is the *parent* of `vendor/`, and the resource-set srcDir
// below points at that parent rather than at the module root: `processResources`
// strips the srcDir prefix, so declaring the folder that directly holds the DLLs
// would flatten ten files into the JAR root instead of nesting them under
// `vendor/`. Flat also means they can never be found again -- the extractor looks
// them up as `/vendor/<name>`.
//
// It must also be declared as an output DIRECTORY, not just `manifest.txt`:
// `srcDir(taskProvider)` harvests exactly what the task declares, so a
// manifest-only declaration silently shipped a manifest with no DLLs next to it.
//
// Like copyNative this NEVER fails the build: `MCDR\external\` is populated by
// hand (the SDK archives are in neither repo), and a missing one just means the
// matching SDK reports itself unavailable at run time.
def vendorJarRoot = layout.buildDirectory.dir('generated/vendorJar')
def vendorJarDir = vendorJarRoot.map { it.dir('vendor') }
var stageVendorLibs = tasks.register('stageVendorLibs') {
    group = 'build'
    description = 'Stages the redistributable (XeSS / FidelityFX) SDK runtimes + licences as mod JAR resources.'
    outputs.dir(vendorJarDir)
    outputs.upToDateWhen { false }

    doLast {
        try {
            var root = vendorJarDir.get().asFile
            root.mkdirs()
            // NOT `manifest`: a `doLast` closure delegates to the task, and Task
            // already owns a `manifest` property, so `var manifest = []` resolves
            // through the owner and dies with "Could not set unknown property
            // 'manifest' for task ...". The catch-all below then reported that as
            // a warning and shipped an empty JAR. Any name the task object already
            // defines is a trap here.
            var manifestEntries = []
            var staged = 0
            var missing = []
            vendorJarLibs.each { entry ->
                File srcDir = entry.dir
                List<String> files = (entry.files ?: []) as List<String>
                if (srcDir == null || !srcDir.isDirectory()) {
                    missing << "${srcDir} (目录不存在)".toString()
                    return
                }
                files.each { String name ->
                    var src = new File(srcDir, name)
                    if (!src.isFile()) {
                        missing << src.toString()
                        return
                    }
                    var dst = new File(root, name)
                    if (!dst.isFile() || dst.length() != src.length()) {
                        dst.bytes = src.bytes
                        staged++
                    }
                    manifestEntries << ("vendor/" + name)
                }
                File lic = entry.license
                if (lic != null && lic.isFile()) {
                    var name = "LICENSE-" + srcDir.parentFile.name + ".txt"
                    var dst = new File(root, name)
                    if (!dst.isFile() || dst.length() != lic.length()) {
                        dst.bytes = lic.bytes
                        staged++
                    }
                    manifestEntries << ("vendor/" + name)
                } else {
                    missing << "licence for ${srcDir} (${lic})".toString()
                }
            }
            var mf = new File(root, 'manifest.txt')
            mf.setText(manifestEntries.join('\n') + '\n', 'UTF-8')
            logger.lifecycle("[stageVendorLibs] ${manifestEntries.size()} resource(s) in the mod JAR " +
                    "(${staged} copied, rest already current)")
            if (!missing.isEmpty()) {
                logger.warn("[stageVendorLibs] not staged (missing source): ${missing.join(', ')}. " +
                        "The matching SDK will report itself unavailable at run time.")
            }
        } catch (Throwable t) {
            logger.warn("[stageVendorLibs] skipped: ${t}")
        }
    }
}
// NOT `sourceSets.main.resources.srcDir stageVendorLibs`: a task provider added
// that way contributes each file with no path prefix, so the SDK runtimes land in
// the resource root and the extractor's `/vendor/<name>` lookups all miss. Two
// rounds of trying to name the staged folder so the prefix would survive both
// flattened instead, so the destination is stated outright here: the main resource
// set is left alone, and `processResources` copies the staged files into `vendor/`
// explicitly. `build/resources/main/vendor/` is then what `runClient` reads and
// what `jar` packages, with neither step left to infer a path.
//
// `from(stageVendorLibs)` passes the TASK, not the directory property: that is
// what wires the dependency and takes the task's declared outputs as the source.
// `from(vendorJarDir)` compiles and silently adds nothing -- processResources ran,
// reported success, and staged no vendor file at all.
tasks.named('processResources', ProcessResources).configure {
    from(stageVendorLibs) {
        into('vendor')
    }
}

// ---------------------------------------------------------------------------
// copyVendorDlls -- dev-only SDK runtimes that must NOT ship
// ---------------------------------------------------------------------------
// Only the NVIDIA ones land here. The packaged SDKs (XeSS / FidelityFX) are
// extracted from the JAR by the mod itself, so they do not need this task.
def copyVendorDlls = tasks.register('copyVendorDlls') {
    group = 'build'
    description = 'Dev-only: stages the NVIDIA (non-redistributable) runtime DLLs into run/dxrmc.'
    var dxrmcDir = layout.projectDirectory.dir('run/dxrmc')
    outputs.dir(dxrmcDir)
    // Never up-to-date on the task level; the per-file size check below is what
    // keeps a no-op second run cheap. A task-level "up to date" would also skip
    // the (cheap) reporting, which is the point of running it.
    outputs.upToDateWhen { false }

    doLast {
        try {
            var dir = dxrmcDir.asFile
            dir.mkdirs()
            var staged = 0
            var alreadyThere = 0
            var missing = []
            vendorDevLibs.each { entry ->
                File srcDir = entry.dir
                String pattern = entry.pattern
                if (srcDir == null || !srcDir.isDirectory()) {
                    missing << "${srcDir} (目录不存在)".toString()
                    return
                }
                var re = java.util.regex.Pattern.compile(vendorGlobToRegex(pattern))
                var matched = (srcDir.listFiles() ?: new File[0]).findAll {
                    it.isFile() && re.matcher(it.name).matches()
                }
                if (matched.isEmpty()) {
                    missing << "${srcDir}${File.separator}${pattern}".toString()
                    return
                }
                matched.each { File src ->
                    var dst = new File(dir, src.name)
                    if (dst.isFile() && dst.length() == src.length()) {
                        alreadyThere++
                        return
                    }
                    dst.bytes = src.bytes
                    staged++
                    logger.lifecycle("[copyVendorDlls] staged ${src.name} (${String.format('%,d', src.length())} bytes)")
                }
            }
            logger.lifecycle("[copyVendorDlls] ${staged} copied, ${alreadyThere} already current")
            if (!missing.isEmpty()) {
                logger.warn("[copyVendorDlls] not staged (missing source): ${missing.join(', ')}. " +
                        "The matching SDK will report itself unavailable at run time.")
            }
        } catch (Throwable t) {
            logger.warn("[copyVendorDlls] skipped: ${t}")
        }
    }
}

// The packaged SDKs need no run-task hook: the mod extracts them from the JAR at
// startup. Only the dev-only NVIDIA DLLs do, and those are staged on demand
// (`gradlew copyVendorDlls`) rather than on every run -- a dev who does not care
// about DLSS should not pay ~115 MB of copying for it.

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// ---------------------------------------------------------------------------
// Kotlin
// ---------------------------------------------------------------------------
// The whole JVM side of this mod is Kotlin except the mixins (Mixin cannot
// target Kotlin classes reliably, and the mixins only touch vanilla types).
//
// Two rules encoded here, both load-bearing and easy to break by accident:
//
//  1. jvmTarget MUST be 25. The Java toolchain is 25 and NeoForge 26.2 ships
//     Java 25 bytecode; letting Kotlin fall back to an older target makes
//     Gradle 9 fail with "Inconsistent JVM-target compatibility".
//  2. Never pass -Xjdk-release. On Kotlin 2.2.x it silently rewrote EVERY
//     java.lang.invoke.MethodHandle.invokeExact call site into a varargs call
//     (KT-72880), which destroys the FFM binding layer at runtime with no
//     compile error. It is fixed in 2.4.x, but there is no reason to use it.
//
// Kotlin source files are always read as UTF-8; unlike JavaCompile there is no
// encoding options to set.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25)
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
