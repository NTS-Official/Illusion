# Kotlin for forge dependency
modLoader="kotlinforforge"
loaderVersion="${kff_version_range}"

license="${mod_license}"
issueTrackerURL="https://github.com/NTS-Official/Illusion/issues"

[[mods]]

modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

# 26.3 迁移清理（P193）：原来的 updateJSONURL 指向
# https://github.com/NTS-Official/Illusion/updates.json —— 该地址（含 raw/main、raw/master 形式）实测全部 404，
# NeoForge 的 VersionChecker 拉回来解析后对 null 的 "promos" 调用 has() → 每次启动一条 NPE 日志。
# 仓库里也没有这个文件，所以先去掉声明；等真正发布 updates.json 再按 raw.githubusercontent.com 的直链填回来。
displayURL="https://github.com/NTS-Official/Illusion"

iconFile="assets/${mod_id}/icon.png"
bannerFile="assets/${mod_id}/logo_flat_dark.png"

credits="DXM Dev Team"
authors="NoTuring_Steve"

description='''
Brings lots of advanced graphics features to Minecraft based on a native library that integrates a DirectX12 Ultimate backend.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="kotlinforforge"
    type="required"
    versionRange="${kff_version_range}"
    ordering="NONE"
    side="CLIENT"
