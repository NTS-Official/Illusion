# Kotlin for forge dependency
modLoader="kotlinforforge"
loaderVersion="${kff_version_range}"

license="${mod_license}"
issueTrackerURL="https://github.com/NTS-Official/Illusion/issues"

[[mods]]

modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

updateJSONURL="https://github.com/NTS-Official/Illusion/updates.json"
displayURL="https://github.com/NTS-Official/Illusion"

iconFile="assets/${mod_id}/icon.png"
logoFile="assets/${mod_id}/logo_flat_dark.png"

credits="DXM Dev Team"
authors="NoTuring_Steve"

description='''
Brings lots of advanced graphics features to Minecraft based on a native library that integrates a DirectX12 Ultimate backend.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="kotlinforforge"
    type="required"
    versionRange="${kff_version_range}"
    ordering="NONE"
    side="CLIENT"
