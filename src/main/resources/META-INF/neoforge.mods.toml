# Kotlin for forge dependency
modLoader="kotlinforforge"
loaderVersion="${kff_version_range}"

license="${mod_license}"
issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/"

[[mods]]

modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

updateJSONURL="https://change.me.example.invalid/updates.json"
displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional

iconFile="examplemod.png" #optional

credits=""
authors="NoTuring_Steve"

description='''
Implements a full ray-tracing pipeline based on DirectX12 Ultimate backend.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="kotlinforforge"
    type="required"
    versionRange="${kff_version_range}"
    ordering="NONE"
    side="CLIENT"
